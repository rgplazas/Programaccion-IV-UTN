<h2>Tablero</h2> 
<div class="board"> 
  @for (col of columns; track col.status) { 
    <section class="column"> 
      <h3>{{ col.label }}</h3> 
      @for (t of tasksByStatus()[col.status]; track t.id) {
        <app-task-card
          [task]="t"
          [compact]="true"
          [days]="3" />
      } @empty { 
        <p class="empty">Nada por aquí</p> 
      } 
    </section> 
  } 
</div>
