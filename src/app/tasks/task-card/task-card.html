<article class="card" [class.compact]="compact()">
    <h3>{{ task().title }}</h3>

    <p class="info">
        <span class="badge">
            Estado: {{ task().status }}
        </span>

        <span class="priority">
            P{{ task().priority }}
        </span>

        <span class="days">
            {{ days() }} días
        </span>
    </p>

    @if (task().status !== 'done') {
        <button type="button" (click)="onDone()">
            Marcar hecho
        </button>
    }

    <button type="button" (click)="onDelete()">
        Eliminar
    </button>
</article>
