@if (task(); as t) {

  <h2>{{ t.title }}</h2>

  <div class="info">
    <span class="badge">
      Estado: {{ label(t.status) }}
    </span>

    <span class="priority">
      Prioridad: P{{ t.priority }}
    </span>
  </div>

  <a [routerLink]="['/tasks', t.id, 'edit']">
    Editar tarea
  </a>

} @else {

  <p class="not-found">
    Tarea no encontrada
  </p>

}
